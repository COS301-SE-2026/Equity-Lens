name: CI 

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR tag to redeploy (e.g. a previous commit SHA already pushed to BACKEND_ECR_REPOSITORY). Leave empty to deploy :latest, same as a normal push-triggered deploy."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
    backend:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: To checkout the repository
              uses: actions/checkout@v4

            - name: To install all python package for backend
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install all the backend dependencies
              working-directory: backend
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install -r requirements-dev.txt

            - name: Run all the backend tests
              working-directory: backend
              env:
                PYTHONPATH: .
              run: python -m pytest

            - name: To Build backend Docker image
              run: docker build -t equity-lens-backend ./backend

            - name: To make the Configure AWS credentials
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: To Log in to Amazon ECR
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              id: login-to-store-credentials
              uses: aws-actions/amazon-ecr-login@v2

            - name: To make a tag and to also push all the backend and all the image from the docker to Amazon ECR
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              env:
                TO_STORE_THE_ECR_REGISTRY: ${{ steps.login-to-store-credentials.outputs.registry }}
                TO_STORE_THE_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker tag equity-lens-backend $TO_STORE_THE_ECR_REGISTRY/$TO_STORE_THE_ECR_REPOSITORY:$IMAGE_TAG
                docker tag equity-lens-backend $TO_STORE_THE_ECR_REGISTRY/$TO_STORE_THE_ECR_REPOSITORY:latest

                docker push $TO_STORE_THE_ECR_REGISTRY/$TO_STORE_THE_ECR_REPOSITORY:$IMAGE_TAG
                docker push $TO_STORE_THE_ECR_REGISTRY/$TO_STORE_THE_ECR_REPOSITORY:latest

            - name: Look up target instance by tag
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              id: find-instance
              run: |
                INSTANCE_ID=$(aws ec2 describe-instances \
                  --filters "Name=tag:Environment,Values=production" "Name=instance-state-name,Values=running" \
                  --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId" \
                  --output text)

                if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
                  echo "::error::no running instance tagged Environment=production was found"
                  exit 1
                fi
                echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

            - name: Deploy to backend via SSM Run Command
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              id: send-command
              env:
                AWS_REGION: ${{ vars.AWS_REGION }}
                ECR_REGISTRY: ${{ steps.login-to-store-credentials.outputs.registry }}
                ECR_REPO: ${{ vars.BACKEND_ECR_REPOSITORY }}
                INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
                DEPLOY_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
              run: |
                COMMANDS=(
                  "set -e"
                  "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY"
                  "docker pull $ECR_REGISTRY/$ECR_REPO:$DEPLOY_TAG"
                  "docker run --rm --env-file /home/ubuntu/backend.env $ECR_REGISTRY/$ECR_REPO:$DEPLOY_TAG alembic upgrade head"
                  "docker stop equity-lens-backend || true"
                  "docker rm equity-lens-backend || true"
                  "docker run -d --name equity-lens-backend -p 8000:8000 --env-file /home/ubuntu/backend.env $ECR_REGISTRY/$ECR_REPO:$DEPLOY_TAG"
                  "HEALTHY=0"
                  "for i in \$(seq 1 30); do"
                  "  if curl -sf http://localhost:8000/health 2>/dev/null | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"ok\"'; then"
                  "    HEALTHY=1"
                  "    break"
                  "  fi"
                  "  sleep 2"
                  "done"
                  "if [ \"\$HEALTHY\" != \"1\" ]; then"
                  "  echo 'backend container never became healthy after 60s - leaving previous image on disk, not pruning' >&2"
                  "  docker logs equity-lens-backend --tail 50 >&2"
                  "  exit 1"
                  "fi"
                  "docker system prune -af"
                )
                PARAMS_JSON=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -s '{commands: .}')

                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --comment "equitylens backend deploy $DEPLOY_TAG (${{ github.sha }})" \
                  --parameters "$PARAMS_JSON" \
                  --query "Command.CommandId" --output text)

                echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

            - name: Wait for deploy command to finish
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              env:
                INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
                COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
              run: |
                aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

                STATUS=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "Status" --output text)
                echo "remote command status: $STATUS"

                if [ "$STATUS" != "Success" ]; then
                  echo "::error::SSM command $COMMAND_ID finished with status $STATUS"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                    --query "{StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
                    --output json
                  exit 1
                fi

    
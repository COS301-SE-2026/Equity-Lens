    nfr-3-1-and-3-2-and-3-3:
        name: NFR-3.1 & NFR-3.2 & NFR-3.3 Pytest
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.11"

            - name: Install dependencies
              working-directory: backend
              run: |
               python -m pip install --upgrade pip setuptools
               pip install -r requirements.txt
               pip install -r requirements-dev.txt
            
            - name: RUN NFR-3.1 Failure Of one part(isolation)
              working-directory: backend
              run: python -m pytest tests/integration/test_nfr_failure_isolation.py

            - name: RUN NFR-3.2 the AI failure to check the API
              working-directory: backend
              run: python -m pytest tests/integration/test_nfr_ai_failure.py

            - name: RUN NFR-3.3 Failure for the market data
              working-directory: backend
              run: python -m pytest tests/integration/test_nfr_holding_failure.py

    nfr-5-3-and-5-2:
        name: NFR-5-3
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: "22"
            
            - name: install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: install Playwright 
              working-directory: frontend
              run: npx playwright install --with-deps

            - name: Run NFR-5.4
              working-directory: frontend
              run: npx playwright test test/nfr/nfr_5_3.spec.js
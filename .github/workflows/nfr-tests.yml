    nfr-1-4:
        name: NFR-1.4 TLS
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: To chekc the HTTPs connection
              run: | 
                set -e
                    curl --fail --show-error \
                    https://api.equitylens.co.za/health
                    curl --fail --show-error \
                    https://www.equitylens.co.za
                    echo "PASS All the HTTPs/TLS connection"

    nfr-1-6:
        name: NFR-1.6 GitLeaks
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Run GitLeaks
              run: |
                docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --verbose

    nfr-2-1-and-3-1-and-3-2:
        name: NFR-2.1 & NFR-4.1 &  NFR-4.2 & NFR-4.3 K6 Performance and scalability
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup K6
              uses: grafana/setup-k6-action@v1

            - name: Run K6 Performance test
              run: |
                k6 run backend/tests/K6/performance.js

            - name: Run K6 scalability 4.1
              run: |
                k6 run backend/tests/K6/scalability_nfr_4.1.js

            - name: Run K6 scalability 4.2
              run: |
                k6 run backend/tests/K6/scalability_nfr_4.2.js

            - name: Run K6 scalability 4.3
              run: |
                k6 run backend/tests/K6/scalability_nfr_4.3.js


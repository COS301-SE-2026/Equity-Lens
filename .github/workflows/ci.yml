name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm run coverage

      - name: Read the installed Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install the Playwright system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: frontend
          files: ./coverage/lcov.info
          flags: frontend

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload the build for the Lighthouse job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile.prod
          tags: equity-lens-frontend-smoketest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:8000\api
            VITE_COGNITO_USER_POOL_ID=af-south-1_smoketest
            VITE_COGNITO_CLIENT_ID=smoketestclientid
            VITE_COGNITO_REGION=af-south-1

      - name: Run frontend smoke-test container
        run: docker run -d --name frontend-smoketest -p 8080:8080 equity-lens-frontend-smoketest

      - name: Wait for frontend smoke-test container to respond
        run: |
          URL="http://localhost:8080/"
          ATTEMPTS=15
          SLEEP_SECONDS=2
          for i in $(seq 1 $ATTEMPTS); do
            BODY=$(curl -sf "$URL" 2>/dev/null) && [ -n "$BODY" ] && {
              echo "frontend responded after $i attempt(s), $(echo -n "$BODY" | wc -c) bytes"
              exit 0
            }
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::frontend smoke-test container never returned a non-empty 200 after $((ATTEMPTS * SLEEP_SECONDS))s"
          echo "container logs : "
          docker logs frontend-smoketest
          exit 1

      - name: Tear down frontend smoke-test container
        if: always()
        run: |
          docker stop frontend-smoketest || true
          docker rm frontend-smoketest || true


  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equitylens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pip-audit to check the packages
        working-directory: backend
        run: pip-audit -r requirements.txt -r requirements-dev.txt 

      - name: Run Bandit to scan for the backend code
        working-directory: backend
        run: bandit -r app

      - name: Run database migrations & verify reversibility
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equitylens
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equitylens
          SECRET_KEY: ${{ vars.TEST_SECRET_KEY }}
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          PYTHONPATH: .
          AWS_REGION: af-south-1
          AWS_COGNITO_CLIENT_ID: ${{ vars.TEST_COGNITO_CLIENT_ID }}
          AWS_COGNITO_USER_POOL_ID: ${{ vars.TEST_COGNITO_USER_POOL_ID }}
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: python -m pytest --cov=app --cov-report=xml --cov-fail-under=70

      - name: Write backend smoke-test env file
        run: |
          cat > backend/smoketest.env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/equitylens
          ALLOW_LIVE_MARKET_FALLBACK=false
          ALPHA_VANTAGE_API_KEY=smoketest-dummy
          MARKET_DATA_REFRESH_TTL_HOURS=24
          SECRET_KEY=smoketest-not-a-real-secret
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          CORS_ORIGINS=["http://localhost:3000"]
          AWS_REGION=af-south-1
          AWS_ACCESS_KEY_ID=dummy
          AWS_SECRET_ACCESS_KEY=dummy
          AWS_COGNITO_USER_POOL_ID=af-south-1_smoketest
          AWS_COGNITO_CLIENT_ID=smoketestclientid
          BEDROCK_MODEL=anthropic.claude-sonnet-4-5-20250929-v1:0
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: equity-lens-backend-smoketest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run backend smoke-test container
        run: |
          docker run -d --name backend-smoketest --network host \
            --env-file backend/smoketest.env equity-lens-backend-smoketest

      - name: Wait for backend smoke-test container to become healthy
        run: |
          URL="http://localhost:8000/health"
          ATTEMPTS=30
          SLEEP_SECONDS=2
          for i in $(seq 1 $ATTEMPTS); do
            RESPONSE=$(curl -sf "$URL" 2>/dev/null) || RESPONSE=""
            if echo "$RESPONSE" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "backend healthy after $i attempt(s): $RESPONSE"
              exit 0
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::backend smoke-test container never became healthy after $((ATTEMPTS * SLEEP_SECONDS))s"
          echo "container logs : "
          docker logs backend-smoketest
          exit 1

      - name: Tear down backend smoke-test container
        if: always()
        run: |
          docker stop backend-smoketest || true
          docker rm backend-smoketest || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend

    


  ToRunlighthouse:
    name: Run Lighthouse NFR-2.2 & NFR-2.3
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci stays - vite preview needs the binary, it is the build we skip
      - working-directory: frontend
        run: npm ci

      - name: Download the build from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - working-directory: frontend
        run: |
          npm run preview -- --host 0.0.0.0 &
          npx wait-on http://localhost:4173

      
      - name: Run NFR-2.2 Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with: 
            configPath: ./frontend/lighthouserc-nfr-2-2.json

      - name: Run NFR-2.3 Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with: 
          configPath: ./frontend/lighthouserc-nfr-2-3.json

  nfr-1-6:
        name: NFR-1.6 GitLeaks
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Run GitLeaks
              run: |
                docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --verbose

  nfr-1-4:
        name: NFR-1.4 TLS
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: To chekc the HTTPs connection
              run: | 
                set -e
                    curl --fail --show-error \
                    https://api.equitylens.co.za/health
                    curl --fail --show-error \
                    https://www.equitylens.co.za
                    echo "PASS All the HTTPs/TLS connection"
    


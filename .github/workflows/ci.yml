name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
        #flip to false later

      - name: Format check
        working-directory: frontend
        run: npm run format:check
        continue-on-error: true
        # flip to false later

      - name: Type check
        working-directory: frontend
        run: npm run typecheck
        continue-on-error: true
         # flip to false, same as other comments

      - name: Dead code scan (knip)
        working-directory: frontend
        run: npx knip
        continue-on-error: true
        #flip to false once knip ignores are tuned for false positives

      - name: Unit tests
        working-directory: frontend
        run: npm run coverage

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: frontend
          files: ./coverage/lcov.info
          flags: frontend

      - name: Build
        working-directory: frontend
        run: npm run build


  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equitylens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
        continue-on-error: true

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app
        continue-on-error: true
        # flip these to false once mypy/ruff baseline is cleared

      - name: Run pip-audit to check the packages
        working-directory: backend
        run: pip-audit -r requirements.txt -r requirements-dev.txt 

      - name: Run Bandit to scan for the backend code
        working-directory: backend
        run: bandit -r app

      - name: Run database migrations & verify reversibility
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equitylens
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equitylens
          SECRET_KEY: ${{ vars.TEST_SECRET_KEY }}
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          PYTHONPATH: .
          AWS_REGION: af-south-1
          AWS_COGNITO_CLIENT_ID: ${{ vars.TEST_COGNITO_CLIENT_ID }}
          AWS_COGNITO_USER_POOL_ID: ${{ vars.TEST_COGNITO_USER_POOL_ID }}
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: python -m pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend

    
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          scanners: vuln,secret,misconfig
          skip-dirs: frontend/node_modules,node_modules,backend/venv,backend/.venv,frontend/dist,frontend/build


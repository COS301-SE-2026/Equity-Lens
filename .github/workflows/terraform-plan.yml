name: Terraform Plan

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -diff

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:

          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan

        continue-on-error: true
        run: terraform plan -input=false -out=tfplan
        env:

          TF_VAR_backend_ecr_repository_name: ${{ vars.BACKEND_ECR_REPOSITORY }}
          TF_VAR_frontend_ecr_repository_name: ${{ vars.FRONTEND_ECR_REPOSITORY }}

      - name: Render plan as text
        if: always()
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan.txt
          else
            echo "terraform plan did not produce a plan file - see the Terraform plan step's log for the error" > plan.txt
          fi

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/plan.txt', 'utf8');

            const maxLen = 60000;
            const body_plan = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncated, see the full output in the Actions run)'
              : plan;

            const marker = '<!-- terraform-plan-comment -->';
            const body = [
              marker,
              `### Terraform plan - \`infrastructure/terraform\` (${{ steps.plan.outcome }})`,
              '',
              `Commit: ${context.sha.slice(0, 7)}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              body_plan,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1


name: Nightly news

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan makes no news calls, dry-run calls but stores nothing, run is the real thing"
        required: true
        type: choice
        options: [plan, dry-run, run]
        default: dry-run

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Look up target instance by tag
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=production" "Name=instance-state-name,Values=running" \
            --query "sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "::error::no running instance tagged Environment=production was found"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Run the nightly job over SSM
        id: send-command
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            plan) FLAG="--plan" ;;
            dry-run) FLAG="--dry-run" ;;
            *) FLAG="" ;;
          esac

          COMMAND="docker exec equity-lens-backend python -m app.scripts.news_nightly --quiet $FLAG"
          echo "running: $COMMAND"
          PARAMS_JSON=$(jq -n --arg cmd "$COMMAND" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "equitylens nightly news ${MODE:-run}" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the job and read its exit code
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          # polled by hand: aws ssm wait gives up after about 100 seconds, and a real night takes
          # longer than that
          STATUS="Pending"
          for i in $(seq 1 80); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

          CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "ResponseCode" --output text)
          echo "remote status: $STATUS, exit code: $CODE"

          # ssm reports any non-zero exit as Failed, so a partial night (exit 1) arrives as
          # Status=Failed with ResponseCode=1 - the code has to be read before the status
          if [ "$CODE" == "1" ]; then
            echo "::warning::partial run - some batches were skipped or the budget ran out, see the summary line above"
            exit 0
          fi
          if [ "$STATUS" != "Success" ] || [ "$CODE" != "0" ]; then
            echo "::error::nightly news finished with status $STATUS and exit code $CODE"
            exit 1
          fi